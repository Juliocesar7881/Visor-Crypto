<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste MACRO API</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: Arial; padding: 20px; }
        pre { background: #0f0f1a; padding: 15px; border-radius: 8px; overflow: auto; }
        .success { color: #0f0; }
        .error { color: #f00; }
        button { background: #4a4af0; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Teste MACRO API</h1>
    
    <button onclick="testAPI()">Testar API</button>
    <button onclick="testFetch()">Testar Fetch</button>
    <button onclick="clearCache()">Limpar Cache</button>
    
    <h2>Resultado:</h2>
    <pre id="result">Clique em um botão para testar...</pre>
    
    <script>
        const API_URL = 'https://juliocesar7881.github.io/macro-api/data/macro-data.json';
        
        function log(msg, isError = false) {
            const el = document.getElementById('result');
            const cls = isError ? 'error' : 'success';
            el.innerHTML += `<span class="${cls}">${new Date().toLocaleTimeString()}: ${msg}</span>\n`;
        }
        
        async function testAPI() {
            document.getElementById('result').innerHTML = '';
            log('Iniciando teste da API...');
            log('URL: ' + API_URL);
            
            try {
                log('Fazendo fetch...');
                const response = await fetch(API_URL);
                log('Response status: ' + response.status);
                log('Response ok: ' + response.ok);
                
                if (response.ok) {
                    const data = await response.json();
                    log('Dados recebidos!');
                    log('lastUpdate: ' + data.lastUpdate);
                    log('Indicadores: ' + (data.marketIndicators?.indicators?.length || 0));
                    log('Eventos calendario: ' + (data.calendar?.events?.length || 0));
                    log('Probabilidades: cut=' + data.probabilities?.cut + '%, hold=' + data.probabilities?.hold + '%');
                    
                    log('\n--- JSON COMPLETO ---');
                    log(JSON.stringify(data, null, 2));
                } else {
                    log('Response NOT OK!', true);
                }
            } catch (e) {
                log('ERRO: ' + e.message, true);
                log('Stack: ' + e.stack, true);
            }
        }
        
        async function testFetch() {
            document.getElementById('result').innerHTML = '';
            log('Testando fetch básico...');
            
            try {
                // Teste 1: Google
                log('Teste 1: Fetch google.com...');
                const r1 = await fetch('https://www.google.com', { mode: 'no-cors' });
                log('Google: OK (no-cors)');
                
                // Teste 2: API simples
                log('Teste 2: JSONPlaceholder...');
                const r2 = await fetch('https://jsonplaceholder.typicode.com/posts/1');
                const d2 = await r2.json();
                log('JSONPlaceholder: OK - title: ' + d2.title?.substring(0, 30));
                
                // Teste 3: Nossa API
                log('Teste 3: Macro API...');
                const r3 = await fetch(API_URL);
                log('Macro API status: ' + r3.status);
                
            } catch (e) {
                log('ERRO: ' + e.message, true);
            }
        }
        
        function clearCache() {
            localStorage.removeItem('macro_api_cache');
            log('Cache limpo!');
        }
    </script>
</body>
</html>
